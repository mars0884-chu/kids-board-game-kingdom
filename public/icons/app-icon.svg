<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">棋藝大冒險圖示</title>
  <desc id="description">以立體棋棋貓頭像為主體的藍紫色遊戲圖示</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="26" x2="448" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a7cf2"/>
      <stop offset=".48" stop-color="#5d4cdb"/>
      <stop offset="1" stop-color="#30236f"/>
    </linearGradient>
    <linearGradient id="rim" x1="86" y1="38" x2="426" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7d4"/>
      <stop offset=".5" stop-color="#ffd76d"/>
      <stop offset="1" stop-color="#d57b35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fff9db" stop-opacity=".98"/>
      <stop offset=".58" stop-color="#ffe9ae" stop-opacity=".62"/>
      <stop offset="1" stop-color="#ffe9ae" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#201650" flood-opacity=".46"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#201650" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#bg)" stroke="#241b5c" stroke-width="16"/>
  <rect x="31" y="31" width="450" height="450" rx="96" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="10"/>
  <circle cx="104" cy="108" r="82" fill="#b8f3f0" opacity=".18"/>
  <circle cx="420" cy="410" r="88" fill="#1f185d" opacity=".2"/>

  <path d="m256 47 34 61h70l-35 61 35 61h-70l-34 61-34-61h-70l35-61-35-61h70z" fill="#3e9fd2" opacity=".74" stroke="#bff3ef" stroke-width="9" stroke-linejoin="round" filter="url(#smallShadow)"/>
  <g fill="#d7fbf1" stroke="#275398" stroke-width="4" opacity=".85">
    <circle cx="256" cy="79" r="8"/>
    <circle cx="228" cy="129" r="8"/>
    <circle cx="284" cy="129" r="8"/>
    <circle cx="200" cy="179" r="8"/>
    <circle cx="312" cy="179" r="8"/>
    <circle cx="172" cy="229" r="8"/>
    <circle cx="340" cy="229" r="8"/>
  </g>

  <circle cx="256" cy="248" r="178" fill="url(#halo)"/>
  <circle cx="256" cy="248" r="163" fill="#21195c" opacity=".28" filter="url(#shadow)"/>
  <circle cx="256" cy="248" r="158" fill="url(#rim)" stroke="#fff8dc" stroke-width="7"/>
  <circle cx="256" cy="248" r="147" fill="#fff3c7" stroke="#382b79" stroke-width="12"/>
  <circle cx="256" cy="248" r="137" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="5"/>

  <ellipse cx="256" cy="314" rx="130" ry="24" fill="#dba65d" opacity=".25"/>
  <image href="./chessy-cat-avatar-front.png" x="61" y="52" width="390" height="390" preserveAspectRatio="xMidYMid meet" filter="url(#smallShadow)"/>

  <g filter="url(#smallShadow)">
    <circle cx="112" cy="412" r="25" fill="#e95a37" stroke="#fff8e8" stroke-width="8"/>
    <circle cx="104" cy="404" r="6" fill="#ffb18d"/>
    <rect x="375" y="383" width="51" height="51" rx="9" fill="#2378cb" stroke="#fff8e8" stroke-width="8" transform="rotate(45 400.5 408.5)"/>
    <path d="m390 400 10-6 10 6-10 6z" fill="#a4e4ff"/>
  </g>
  <path d="m88 285 7-14 7 14 14 7-14 7-7 14-7-14-14-7z" fill="#fff3a5" stroke="#c68a36" stroke-width="4"/>
  <path d="m428 145 5-10 5 10 10 5-10 5-5 10-5-10-10-5z" fill="#fff3a5" opacity=".9"/>
</svg>
